name: Selenium Java Tests & Docker Publish

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  selenium-test:
    name: Run Selenium TestNG Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: maven

      - name: Set up Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java and Chrome
        run: |
          java -version
          google-chrome --version

      - name: Run Selenium tests
        run: mvn clean test

      - name: Upload TestNG Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-html-report
          path: target/surefire-reports/
          retention-days: 7

  build-and-publish-docker:
    name: Build & Publish Docker Image
    needs: selenium-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Docker Hub Credentials Presence
        env:
          DOCKER_TOKEN_VAL: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}
          DOCKER_USER_VAL: ${{ secrets.DOCKERHUB_USERNAME || 'pruthvikv' }}
        run: |
          if [ -z "$DOCKER_TOKEN_VAL" ]; then
            echo "::error::Docker Hub token secret is EMPTY. Please add DOCKERHUB_TOKEN under 'Repository secrets' at https://github.com/vvce24cseaiml0162-glitch/seleniumlocalwebtest/settings/secrets/actions"
            exit 1
          fi
          echo "Docker Hub Username: $DOCKER_USER_VAL"
          echo "Docker Hub Token is present (character length: ${#DOCKER_TOKEN_VAL})"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'pruthvikv' }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_TOKEN || secrets.DOCKER_PASSWORD || secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            pruthvikv/selenium-testng-automation:latest
            pruthvikv/selenium-testng-automation:${{ github.sha }}
